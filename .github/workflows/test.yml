name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Trypillia
        uses: trypillia/setup-trypillia@v2
        with:
          version: 'latest'

      - name: Run Logger Tests
        run: trypillia-test --coverage test.try

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.info
