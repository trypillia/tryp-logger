name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Trypillia
        uses: trypillia/setup-trypillia@v1
        with:
          version: 'latest'

      - name: Run Logger Tests
        run: trypillia-test test.try
